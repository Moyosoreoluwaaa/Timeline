name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: ${{ runner.tool_cache }}/android-sdk
        run: |
          sudo mkdir -p $ANDROID_HOME
          sudo chown $USER $ANDROID_HOME
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Build project (assembleDebug)
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      # Optional: lint / static analysis
      # - name: Run lint
      #   run: ./gradlew :androidApp:lint

