name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK components (no emulator)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.0
          target: google_apis

      - name: Run Gradle assemble & unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --no-daemon
          ./gradlew test --no-daemon
